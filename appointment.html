<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="service__panel">
          <div class="panel__wrapper">
            <h3 class="font__large primary__color">Book Your Chair Time</h3>
            <h3>
              Select your service, pick an available date, and lock in a time
              slot.
            </h3>
          </div>

          <span class="font__large primary__color">Choose a Service</span>
          <div class="panel__item">
            <h3>Regular Haircut</h3>
            <span class="bold font__medium">$30</span>
            <button class="primary__button service-btn">Select</button>
          </div>
          <div class="panel__item">
            <h3>Kids Haircut</h3>
            <span class="bold font__medium">$30</span>
            <button class="primary__button service-btn">Select</button>
          </div>
          <div class="panel__item">
            <h3>Senior Cut</h3>
            <span class="bold font__medium">$30</span>
            <button class="primary__button service-btn">Select</button>
          </div>
          <div class="panel__item">
            <h3>Haircut with Beard Trim</h3>
            <span class="bold font__medium">$30</span>
            <button class="primary__button service-btn">Select</button>
          </div>

          <span class="font__large primary__color"
            >Select Appointment Time</span
          >
          <div class="tab__panel">
            <div class="tabs">
              <button class="tab" data-tab="monday">Monday</button>
              <button class="tab" data-tab="tuesday">Tuesday</button>
              <button class="tab" data-tab="wednesday">Wednesday</button>
              <button class="tab" data-tab="thursday">Thursday</button>
              <button class="tab" data-tab="friday">Friday</button>
              <button class="tab" data-tab="saturday">Saturday</button>
              <button class="tab" data-tab="sunday">Sunday</button>
            </div>
            <div class="tab__content" id="monday">
              <h3>Monday</h3>
              <div class="tab__wrapper">
                <button class="primary__button">1:00 PM</button>
                <button class="primary__button">2:00 PM</button>
                <button class="primary__button">3:00 PM</button>
              </div>
            </div>
            <div class="tab__content" id="tuesday">
              <h3>Tuesday</h3>
              <div class="tab__wrapper">
                <button class="primary__button">1:00 PM</button>
                <button class="primary__button">2:00 PM</button>
                <button class="primary__button">3:00 PM</button>
              </div>
            </div>
            <div class="tab__content" id="wednesday">
              <h3>Wednesday</h3>
              <div class="tab__wrapper">
                <button class="primary__button">1:00 PM</button>
                <button class="primary__button">2:00 PM</button>
                <button class="primary__button">3:00 PM</button>
              </div>
            </div>
            <div class="tab__content" id="thursday">
              <h3>Thursday</h3>
              <div class="tab__wrapper">
                <button class="primary__button">1:00 PM</button>
                <button class="primary__button">2:00 PM</button>
                <button class="primary__button">3:00 PM</button>
              </div>
            </div>

            <div class="tab__content" id="friday">
              <h3>Friday</h3>
              <div class="tab__wrapper">
                <button class="primary__button">1:00 PM</button>
                <button class="primary__button">2:00 PM</button>
                <button class="primary__button">3:00 PM</button>
              </div>
            </div>

            <div class="tab__content" id="saturday">
              <h3>Saturday</h3>
              <div class="tab__wrapper">
                <button class="primary__button">1:00 PM</button>
                <button class="primary__button">2:00 PM</button>
                <button class="primary__button">3:00 PM</button>
              </div>
            </div>

            <!-- Sunday -->
            <div class="tab__content" id="sunday">
              <h3>Sunday</h3>
              <div class="tab__wrapper">
                <button class="primary__button">1:00 PM</button>
                <button class="primary__button">2:00 PM</button>
                <button class="primary__button">3:00 PM</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
  <script src="index.js" defer></script>
</html>
